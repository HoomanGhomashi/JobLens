<div class="flex items-center justify-between border-t border-slate-200 px-5 py-3 text-sm text-slate-500">
  <p>
    @if (totalCount() === 0) {
      Aucun résultat
    } @else {
      {{ rangeStart() }}–{{ rangeEnd() }} sur {{ totalCount() }}
    }
  </p>
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="rounded-md border border-slate-200 px-3 py-1 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50"
      [disabled]="page() <= 1"
      (click)="goTo(page() - 1)"
    >
      Précédent
    </button>
    <span class="text-slate-400">Page {{ page() }} / {{ totalPages() }}</span>
    <button
      type="button"
      class="rounded-md border border-slate-200 px-3 py-1 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-50"
      [disabled]="page() >= totalPages()"
      (click)="goTo(page() + 1)"
    >
      Suivant
    </button>
  </div>
</div>
