<div class="flex items-center justify-between border-t border-border px-5 py-3 text-sm text-fg-muted">
  <p>
    @if (totalCount() === 0) {
      Aucun résultat
    } @else {
      {{ rangeStart() }}–{{ rangeEnd() }} sur {{ totalCount() }}
    }
  </p>
  <div class="flex items-center gap-2">
    <button
      type="button"
      class="rounded-md border border-border px-3 py-1 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-surface-hover hover:text-fg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
      [disabled]="page() <= 1"
      (click)="goTo(page() - 1)"
    >
      Précédent
    </button>
    <span class="text-zinc-600">Page {{ page() }} / {{ totalPages() }}</span>
    <button
      type="button"
      class="rounded-md border border-border px-3 py-1 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-surface-hover hover:text-fg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
      [disabled]="page() >= totalPages()"
      (click)="goTo(page() + 1)"
    >
      Suivant
    </button>
  </div>
</div>
