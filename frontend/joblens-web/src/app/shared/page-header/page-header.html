<div class="flex flex-wrap items-start justify-between gap-4">
  <div>
    <h1 class="text-2xl font-semibold text-fg">{{ title() }}</h1>
    @if (description()) {
      <p class="mt-1 text-sm text-fg-muted">{{ description() }}</p>
    }
  </div>

  <div class="flex items-center gap-2">
    <span
      class="inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium ring-1 ring-inset"
      [class]="data.isDemo ? 'bg-amber-500/10 text-amber-400 ring-amber-500/20' : 'bg-emerald-500/10 text-emerald-400 ring-emerald-500/20'"
    >
      <span class="h-1.5 w-1.5 rounded-full" [class]="data.isDemo ? 'bg-amber-400' : 'bg-emerald-400'"></span>
      {{ data.isDemo ? 'Demo Data' : 'Local Data' }}
    </span>

    @if (showRefresh()) {
      <button
        type="button"
        (click)="refresh.emit()"
        aria-label="Rafraîchir les données"
        class="inline-flex items-center gap-1.5 rounded-full border border-border bg-surface px-3 py-1 text-xs font-medium text-fg-muted hover:bg-surface-hover hover:text-fg transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-500"
      >
        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
        </svg>
        Refresh
      </button>
    }
  </div>
</div>
