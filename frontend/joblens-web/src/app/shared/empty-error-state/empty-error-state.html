<div
  class="flex flex-col items-center justify-center gap-2 rounded-xl border px-6 py-14 text-center"
  [class]="kind() === 'error' ? 'border-red-500/20 bg-red-500/5' : 'border-border bg-surface'"
  role="status"
>
  <svg
    class="h-8 w-8"
    [class]="kind() === 'error' ? 'text-red-400' : 'text-zinc-600'"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5"
    aria-hidden="true"
  >
    @if (kind() === 'error') {
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
    } @else {
      <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 7.5l-.625 10.632a2.25 2.25 0 01-2.247 2.118H6.622a2.25 2.25 0 01-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375C2.754 3.75 2.25 4.254 2.25 4.875v1.5c0 .621.504 1.125 1.125 1.125z" />
    }
  </svg>
  <p class="text-sm font-medium" [class]="kind() === 'error' ? 'text-red-400' : 'text-fg'">{{ title() }}</p>
  @if (description()) {
    <p class="max-w-sm text-xs" [class]="kind() === 'error' ? 'text-red-400/70' : 'text-fg-muted'">{{ description() }}</p>
  }
</div>
