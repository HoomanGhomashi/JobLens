<div class="flex h-screen bg-slate-50 text-slate-900">
  <aside class="hidden md:flex md:w-64 md:flex-col border-r border-slate-200 bg-white">
    <div class="px-6 py-5 border-b border-slate-200">
      <p class="text-lg font-semibold tracking-tight text-slate-900">JobLens</p>
      <p class="text-xs text-slate-500">Research Dashboard</p>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-indigo-50 text-indigo-700"
          class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 transition-colors"
        >
          <svg class="h-5 w-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
            <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.icon" />
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>
    <div class="px-6 py-4 border-t border-slate-200 text-xs text-slate-400">
      Données réelles — research.* (SQL Server)
    </div>
  </aside>

  <div class="flex flex-1 flex-col overflow-hidden">
    <header class="md:hidden border-b border-slate-200 bg-white px-4 py-3">
      <p class="text-base font-semibold">{{ title() }}</p>
    </header>
    <nav class="md:hidden flex overflow-x-auto border-b border-slate-200 bg-white px-2">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="text-indigo-700 border-indigo-600"
          class="whitespace-nowrap border-b-2 border-transparent px-3 py-2 text-sm font-medium text-slate-500"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <main class="flex-1 overflow-y-auto p-4 md:p-8">
      <router-outlet />
    </main>
  </div>
</div>
